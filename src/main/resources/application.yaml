spring:
  application:
    name: product-api

  datasource:
    url: jdbc:postgresql://[::1]:5432/product_api
    username: product_user
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false